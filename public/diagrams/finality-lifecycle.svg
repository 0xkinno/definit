  <g><text text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="600" fill="#131518"><tspan x="620" y="76.40">ACTION</tspan></text>
  <text text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="600" fill="#131518"><tspan x="620" y="208.40">ADJUDICATION</tspan></text>
  <text text-anchor="middle" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7078"><tspan x="620" y="231.48">validators independently inspect the same evidence</tspan></text>
  <text text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="600" fill="#A9700F"><tspan x="620" y="356.40">ACCEPTED</tspan></text>
  <text text-anchor="middle" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#A9700F"><tspan x="620" y="376.66">provisional, still appealable</tspan></text>
  <text text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="600" fill="#1B6A53"><tspan x="620" y="512.40">FINALIZED</tspan></text>
  <text text-anchor="middle" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B6A53"><tspan x="620" y="532.66">the authority to move value</tspan></text>
  <text text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Cascadia Mono, Consolas, monospace" font-size="20" font-weight="600" fill="#14513F"><tspan x="620" y="646.40">SETTLEMENT</tspan></text>
  <text text-anchor="middle" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#14513F"><tspan x="620" y="666.66">irreversible</tspan></text>
  <text text-anchor="start" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#8F3A2E"><tspan x="1046" y="468.30">NO SETTLEMENT</tspan></text>
  <text text-anchor="start" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078"><tspan x="1046" y="488.66">refused while the</tspan></text>
  <text text-anchor="start" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078"><tspan x="1046" y="506.66">window is open</tspan></text>
  <text text-anchor="start" font-family="Manrope, Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078"><tspan x="40" y="724.66">ACCEPTED is a provisional record. Only FINALIZED authorises release, and release is the only step that moves value.</tspan></text></g>
  </g>
</svg>
