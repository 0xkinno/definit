  <title id="definit-lifecycle-title">How a DEFINIT action becomes settlement</title>
  <desc id="definit-lifecycle-desc">An action is adjudicated by independent validators and lands as ACCEPTED, which is provisional and still appealable. Releasing value at that point is refused while the appeal window is open. Only once the decision is FINALIZED may the escrow be released into SETTLEMENT.</desc>
